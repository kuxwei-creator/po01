
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的投資組合損益監控</title>
    <style>
        :root {
            --up-color: #ff3b30; /* 亮紅 */
            --down-color: #28a745; /* 綠 */
            --glass-bg: rgba(255, 255, 255, 0.85);
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-image: url('https://chinesedora.com/news/wp-content/uploads/2023/04/202304-jp-wallpaper.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th {
            background-color: rgba(0, 86, 179, 0.1);
            color: #333;
            padding: 12px;
            border-bottom: 2px solid #0056b3;
        }
        td {
            padding: 15px 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        input[type="number"] {
            width: 90px;
            padding: 10px;
            border: 2px solid #0056b3;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            background: white;
        }
        .profit { color: var(--up-color); font-weight: bold; }
        .loss { color: var(--down-color); font-weight: bold; }
        
        .summary-box {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 86, 179, 0.8);
            color: white;
            padding: 20px;
            border-radius: 12px;
            flex-wrap: wrap;
        }
        .summary-item {
            flex: 1;
            min-width: 150px;
            text-align: center;
        }
        .summary-label {
            font-size: 0.9em;
            opacity: 0.9;
            display: block;
        }
        .summary-value {
            font-size: 1.4em;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }
        .total-profit-box {
            width: 100%;
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>哆啦A夢風格投資試算</h2>
    
    <table>
        <thead>
            <tr>
                <th>代號</th>
                <th>股數</th>
                <th>平均成本</th>
                <th>目前市價</th>
                <th>損益 (報酬率)</th>
            </tr>
        </thead>
        <tbody id="stock-list">
            <!-- JS 渲染內容 -->
        </tbody>
    </table>

    <div class="summary-box">
        <div class="summary-item">
            <span class="summary-label">總投入本金</span>
            <span id="total-cost" class="summary-value">$0</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">目前總市值</span>
            <span id="total-market-value" class="summary-value">$0</span>
        </div>
        <div class="total-profit-box">
            <span class="summary-label">預估總盈虧</span>
            <span id="total-profit" style="font-size: 2em;">$0</span>
        </div>
    </div>
</div>

<script>
    const stocks = [
        { code: '0056', shares: 63345, cost: 37.91 },
        { code: '00878', shares: 3780, cost: 21.91 }
    ];

    function init() {
        const tbody = document.getElementById('stock-list');
        stocks.forEach((stock, index) => {
            const savedPrice = localStorage.getItem(`price_${stock.code}`) || stock.cost;
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${stock.code}</strong></td>
                <td>${stock.shares.toLocaleString()}</td>
                <td>${stock.cost}</td>
                <td><input type="number" step="0.01" value="${savedPrice}" id="price_${index}" oninput="calculate()"></td>
                <td id="result_${index}">-</td>
            `;
            tbody.appendChild(tr);
        });
        calculate();
    }

    function calculate() {
        let totalCost = 0;
        let totalMarketValue = 0;

        stocks.forEach((stock, index) => {
            const currentPrice = parseFloat(document.getElementById(`price_${index}`).value) || 0;
            localStorage.setItem(`price_${stock.code}`, currentPrice);

            const costAmount = stock.shares * stock.cost;
            const marketValue = stock.shares * currentPrice;
            const profit = marketValue - costAmount;
            const percent = (profit / costAmount) * 100;

            totalCost += costAmount;
            totalMarketValue += marketValue;

            const resultCell = document.getElementById(`result_${index}`);
            resultCell.innerHTML = `
                <div class="${profit >= 0 ? 'profit' : 'loss'}">
                    ${Math.round(profit).toLocaleString()}<br>
                    (${percent.toFixed(2)}%)
                </div>
            `;
        });

        const totalProfit = totalMarketValue - totalCost;
        document.getElementById('total-cost').innerText = '$' + Math.round(totalCost).toLocaleString();
        document.getElementById('total-market-value').innerText = '$' + Math.round(totalMarketValue).toLocaleString();
        
        const totalProfitEl = document.getElementById('total-profit');
        totalProfitEl.innerText = (totalProfit >= 0 ? '+' : '') + Math.round(totalProfit).toLocaleString();
        totalProfitEl.style.color = totalProfit >= 0 ? '#ffeb3b' : '#00e676'; // 在深藍背景上用黃色/亮綠更顯眼
    }

    window.onload = init;
</script>

</body>
</html>
