<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共乘運費預估計算器</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #1a1a1a;
            font-size: 22px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #4a4a4a;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 24px;
            display: none;
        }
        .plan-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .plan-title {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-bottom: 6px;
        }
        .plan-price {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
        }
        .plan-desc {
            font-size: 13px;
            color: #6c757d;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>共乘運費預估計算器</h2>
    
    <div class="input-group">
        <label for="publicTransport">單人大眾運輸運費 (元)</label>
        <input type="number" id="publicTransport" placeholder="例如：900" min="0">
    </div>

    <div class="input-group">
        <label for="distance">來回距離 (公里)</label>
        <input type="number" id="distance" placeholder="例如：390" min="0">
    </div>

    <div class="input-group">
        <label for="duration">來回開車時間 (小時)</label>
        <input type="number" id="duration" placeholder="例如：5" step="0.5" min="0">
    </div>

    <button onclick="calculate()">估算運費</button>

    <div id="results" class="result-box">
        <div class="plan-card">
            <div class="plan-title">A 方案：大眾運輸 8 折價 (適合單人)</div>
            <div class="plan-price" id="priceA">$0 元</div>
            <div class="plan-desc">計算方式：單人大眾運輸票價 × 0.8</div>
        </div>

        <div class="plan-card">
            <div class="plan-title">B 方案：電費 + 基本工資 (適合包車/多人)</div>
            <div class="plan-price" id="priceB">$0 元</div>
            <div class="plan-desc" id="descB">含電費 $0 + 基本工資 $0</div>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const publicTransport = parseFloat(document.getElementById('publicTransport').value);
        const distance = parseFloat(document.getElementById('distance').value);
        const duration = parseFloat(document.getElementById('duration').value);

        if (isNaN(publicTransport) || isNaN(distance) || isNaN(duration)) {
            alert('請填寫所有欄位！');
            return;
        }

        // A 方案計算：大眾運輸打 8 折
        const planA = Math.round(publicTransport * 0.8);

        // B 方案計算：
        // 1. 電費：距離 / 8 公里(每度電) * 8 元(每度電價) => 剛好等於距離公里數
        const electricFee = (distance / 8) * 8; 
        
        // 2. 基本工資：時間 * 200元/小時
        const wage = duration * 200;
        
        // B 方案總額
        const planB = Math.round(electricFee + wage);

        // 顯示結果
        document.getElementById('priceA').innerText = `$${planA.toLocaleString()} 元`;
        document.getElementById('priceB').innerText = `$${planB.toLocaleString()} 元`;
        document.getElementById('descB').innerText = `含電費 $${Math.round(electricFee).toLocaleString()} (耗電 ${ (distance/8).toFixed(1) } 度) + 工資 $${wage.toLocaleString()}`;

        document.getElementById('results').style.display = 'block';
    }
</script>

</body>
</html>
