<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的投資組合新舊市值與權重對比監控</title>
    <style>
        :root {
            --up-color: #ff3b30; /* 亮紅 */
            --down-color: #28a745; /* 綠 */
            --glass-bg: rgba(255, 255, 255, 0.9);
            --primary-blue: rgba(0, 86, 179, 0.8);
        }
        body {
            margin: 0;
            padding: 20px 0;
            min-height: 100vh;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-image: url('https://chinesedora.com/news/wp-content/uploads/2023/04/202304-jp-wallpaper.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
        }
        .container {
            width: 95%;
            max-width: 1000px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            margin-bottom: 20px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .btn {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-save {
            background-color: #28a745;
            color: white;
        }
        .btn-save:hover { background-color: #218838; transform: translateY(-2px); }
        .btn-clear {
            background-color: #6c757d;
            color: white;
        }
        .btn-clear:hover { background-color: #5a6268; transform: translateY(-2px); }
        
        .section-title {
            font-size: 1.3em;
            color: #0056b3;
            border-left: 5px solid #0056b3;
            padding-left: 10px;
            margin: 25px 0 15px 0;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        th {
            background-color: rgba(0, 86, 179, 0.1);
            color: #333;
            padding: 12px;
            border-bottom: 2px solid #0056b3;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        input[type="number"] {
            width: 95px;
            padding: 8px;
            border: 2px solid #0056b3;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            background: white;
        }
        .profit { color: var(--up-color); font-weight: bold; }
        .loss { color: var(--down-color); font-weight: bold; }
        .weight-text { color: #555; font-weight: 500; }
        
        .summary-box {
            display: flex;
            justify-content: space-between;
            background: var(--primary-blue);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .summary-item {
            flex: 1;
            min-width: 130px;
            text-align: center;
        }
        .summary-label {
            font-size: 0.85em;
            opacity: 0.9;
            display: block;
        }
        .summary-value {
            font-size: 1.25em;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }
        .section-profit-box {
            flex: 1;
            min-width: 150px;
            text-align: center;
        }

        /* 差異比較區塊 */
        .comparison-box {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }
        .comparison-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .comparison-diff {
            font-size: 2.2em;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>哆啦A夢風格投資試算（前後對比版）</h2>
    
    <div class="action-bar">
        <button class="btn btn-save" onclick="savePrices()">💾 儲存目前市價</button>
        <button class="btn btn-clear" onclick="clearPrices()">🧹 清空所有市價</button>
    </div>

    <div class="section-title">📊 上半部：以前的持股組合</div>
    <table>
        <thead>
            <tr>
                <th>代號</th>
                <th>股數</th>
                <th>平均成本</th>
                <th>成本佔比</th>
                <th>目前市價 (請自行輸入)</th>
                <th>損益 (報酬率)</th>
            </tr>
        </thead>
        <tbody id="past-stock-list">
            </tbody>
    </table>
    <div class="summary-box">
        <div class="summary-item">
            <span class="summary-label">前持股總投入</span>
            <span id="past-total-cost" class="summary-value">$0</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">前持股估總市值</span>
            <span id="past-total-market-value" class="summary-value">$0</span>
        </div>
        <div class="section-profit-box">
            <span class="summary-label">前組合總盈虧</span>
            <span id="past-total-profit" class="summary-value" style="font-size: 1.4em;">$0</span>
        </div>
    </div>

    <div class="section-title">📈 下半部：現在的持股組合</div>
    <table>
        <thead>
            <tr>
                <th>代號</th>
                <th>股數</th>
                <th>平均成本</th>
                <th>成本佔比</th>
                <th>目前市價 (請自行輸入)</th>
                <th>損益 (報酬率)</th>
            </tr>
        </thead>
        <tbody id="current-stock-list">
            </tbody>
    </table>
    <div class="summary-box">
        <div class="summary-item">
            <span class="summary-label">現持股總投入</span>
            <span id="current-total-cost" class="summary-value">$0</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">現持股估總市值</span>
            <span id="current-total-market-value" class="summary-value">$0</span>
        </div>
        <div class="section-profit-box">
            <span class="summary-label">現組合總盈虧</span>
            <span id="current-total-profit" class="summary-value" style="font-size: 1.4em;">$0</span>
        </div>
    </div>

    <div class="comparison-box">
        <div class="comparison-title">🔄 總市值成效差異比較 ( 現在總市值 - 以前總市值 )</div>
        <div id="market-value-diff" class="comparison-diff">$0</div>
    </div>
</div>

<script>
    // 以前的持股數據
    const pastStocks = [
        { code: '0056', shares: 63345, cost: 37.91 },
        { code: '00878', shares: 3780, cost: 21.91 }
    ];

    // 現在的持股數據（已更新數據，並保留最下方的 0050 預備位）
    const currentStocks = [
        { code: '006208', shares: 420, cost: 231.98 },
        { code: '2330', shares: 377, cost: 2393.46 },
        { code: '2454', shares: 1, cost: 4280 },
        { code: '0056', shares: 18000, cost: 40.53 },
        { code: '2330', shares: 392, cost: 2263.99 },
        { code: '2454', shares: 72, cost: 4546.46 },
        { code: '0050', shares: 330, cost: 106.1 } 
    ];

    function init() {
        // 先計算各組的總成本，以便在渲染表格時可以直接算出佔比
        const pastTotalCost = pastStocks.reduce((sum, s) => sum + (s.shares * s.cost), 0);
        const currentTotalCost = currentStocks.reduce((sum, s) => sum + (s.shares * s.cost), 0);

        // 渲染以前的持股
        renderTable('past-stock-list', pastStocks, 'past', pastTotalCost);
        // 渲染現在的持股
        renderTable('current-stock-list', currentStocks, 'current', currentTotalCost);
        
        // 執行初始計算（抓取上次存檔的值）
        calculate();
    }

    function renderTable(tbodyId, stockArray, prefix, groupTotalCost) {
        const tbody = document.getElementById(tbodyId);
        stockArray.forEach((stock, index) => {
            // 從 LocalStorage 嘗試抓取上次儲存的市價，若無則預設為留空 ""
            const savedPrice = localStorage.getItem(`${prefix}_price_${index}_${stock.code}`) || "";
            
            // 計算此股票的投入成本與佔該組總成本的比例
            const myCost = stock.shares * stock.cost;
            const weightPercent = groupTotalCost > 0 ? ((myCost / groupTotalCost) * 100).toFixed(2) : "0.00";

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${stock.code}</strong></td>
                <td>${stock.shares.toLocaleString()}</td>
                <td>${stock.cost.toLocaleString()}</td>
                <td class="weight-text">${weightPercent}%</td>
                <td><input type="number" step="0.01" value="${savedPrice}" placeholder="未輸入" id="${prefix}_price_${index}" oninput="calculate()"></td>
                <td id="${prefix}_result_${index}">-</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function calculateGroup(stockArray, prefix) {
        let totalCost = 0;
        let totalMarketValue = 0;
        let totalProfit = 0;
        let hasInput = false;

        stockArray.forEach((stock, index) => {
            const inputEl = document.getElementById(`${prefix}_price_${index}`);
            const currentPrice = parseFloat(inputEl.value);
            
            const costAmount = stock.shares * stock.cost;
            totalCost += costAmount;

            const resultCell = document.getElementById(`${prefix}_result_${index}`);

            // 如果有輸入市價且大於 0 才會進行該檔股票的計算
            if (!isNaN(currentPrice) && currentPrice > 0) {
                hasInput = true;

                const marketValue = stock.shares * currentPrice;
                const profit = marketValue - costAmount;
                // 如果成本為 0 (如新加入未買入的股票)，投報率顯示為 0%
                const percent = costAmount > 0 ? (profit / costAmount) * 100 : 0;

                totalMarketValue += marketValue;
                totalProfit += profit;

                resultCell.innerHTML = `
                    <div class="${profit >= 0 ? 'profit' : 'loss'}">
                        ${profit >= 0 ? '+' : ''}${Math.round(profit).toLocaleString()}<br>
                        (${percent >= 0 ? '+' : ''}${percent.toFixed(2)}%)
                    </div>
                `;
            } else {
                resultCell.innerHTML = `<span style="color:#888;">等待輸入</span>`;
            }
        });

        // 刷新該群組的面板數值
        document.getElementById(`${prefix}-total-cost`).innerText = '$' + Math.round(totalCost).toLocaleString();
        
        const totalMarketValueEl = document.getElementById(`${prefix}-total-market-value`);
        const totalProfitEl = document.getElementById(`${prefix}-total-profit`);

        if (hasInput) {
            totalMarketValueEl.innerText = '$' + Math.round(totalMarketValue).toLocaleString();
            totalProfitEl.innerText = (totalProfit >= 0 ? '+' : '') + Math.round(totalProfit).toLocaleString();
            totalProfitEl.style.color = totalProfit >= 0 ? '#ffeb3b' : '#00e676';
            return totalMarketValue;
        } else {
            totalMarketValueEl.innerText = '-';
            totalProfitEl.innerText = '$0';
            totalProfitEl.style.color = 'white';
            return 0;
        }
    }

    function calculate() {
        const pastMV = calculateGroup(pastStocks, 'past');
        const currentMV = calculateGroup(currentStocks, 'current');

        const diff = currentMV - pastMV;
        const diffEl = document.getElementById('market-value-diff');
        
        if (pastMV > 0 && currentMV > 0) {
            if (diff > 0) {
                diffEl.innerText = '現在市值較高：+' + Math.round(diff).toLocaleString();
                diffEl.style.color = '#ffeb3b';
            } else if (diff < 0) {
                diffEl.innerText = '以前市值較高：' + Math.round(diff).toLocaleString();
                diffEl.style.color = '#00e676';
            } else {
                diffEl.innerText = '$0 (兩者總市值相同)';
                diffEl.style.color = 'white';
            }
        } else {
            diffEl.innerText = '請同時輸入新舊組合的市價以進行比較';
            diffEl.style.color = '#ccc';
            diffEl.style.fontSize = '1.4em';
        }
    }

    // 點擊按鈕時，將市價儲存至瀏覽器（此處將 index 納入 Key 名稱以支援重複代號獨立儲存）
    function savePrices() {
        pastStocks.forEach((stock, index) => {
            const price = document.getElementById(`past_price_${index}`).value;
            if(price && parseFloat(price) > 0) {
                localStorage.setItem(`past_price_${index}_${stock.code}`, price);
            } else {
                localStorage.removeItem(`past_price_${index}_${stock.code}`);
            }
        });

        currentStocks.forEach((stock, index) => {
            const price = document.getElementById(`current_price_${index}`).value;
            if(price && parseFloat(price) > 0) {
                localStorage.setItem(`current_price_${index}_${stock.code}`, price);
            } else {
                localStorage.removeItem(`current_price_${index}_${stock.code}`);
            }
        });

        alert("💾 目前填寫的市價已成功儲存！下次開啟網頁會自動帶入。");
    }

    // 清除所有目前填寫的市價與快取紀錄
    function clearPrices() {
        if(confirm("確定要清空畫面上所有市價，並刪除儲存紀錄嗎？")) {
            pastStocks.forEach((stock, index) => {
                document.getElementById(`past_price_${index}`).value = "";
                localStorage.removeItem(`past_price_${index}_${stock.code}`);
            });
            currentStocks.forEach((stock, index) => {
                document.getElementById(`current_price_${index}`).value = "";
                localStorage.removeItem(`current_price_${index}_${stock.code}`);
            });
            calculate();
        }
    }

    window.onload = init;
</script>

</body>
</html>
